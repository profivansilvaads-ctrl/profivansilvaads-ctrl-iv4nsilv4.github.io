<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — Festa ACS</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
    h1 { color: #1565c0; }
    .resumo { display: flex; gap: 20px; margin: 20px 0; }
    .card { background: #e3f2fd; padding: 15px 25px; border-radius: 10px; text-align: center; }
    .card h2 { margin: 5px 0; font-size: 2em; color: #1565c0; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { background: #1565c0; color: white; padding: 10px; }
    td { padding: 8px 10px; border-bottom: 1px solid #ddd; }
    tr:hover { background: #f5f5f5; }
    .btn { background: #1565c0; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
    .btn:hover { background: #0d47a1; }
    #login { max-width: 300px; margin: 100px auto; text-align: center; }
    #login input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    #conteudo { display: none; }
  </style>
</head>
<body>

<div id="login">
  <h1>🔐 Admin</h1>
  <input type="password" id="senha" placeholder="Senha do administrador">
  <button class="btn" onclick="entrar()">Entrar</button>
</div>

<div id="conteudo">
  <h1>📋 Painel de Inscrições — Festa ACS 30 Anos</h1>
  
  <div class="resumo">
    <div class="card"><p>ACS Inscritos</p><h2 id="totalACS">-</h2></div>
    <div class="card"><p>Convidados</p><h2 id="totalConvidados">-</h2></div>
    <div class="card"><p>Total Participantes</p><h2 id="totalTotal">-</h2></div>
  </div>

  <button class="btn" onclick="exportarCSV()">⬇️ Exportar CSV</button>
  <button class="btn" onclick="carregarDados()">🔄 Atualizar</button>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Nome do ACS</th>
        <th>Nome do Convidado</th>
        <th>Data/Hora</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>
</div>

<script>
  let senha = '';
  let dados = [];

  function entrar() {
    senha = document.getElementById('senha').value;
    carregarDados();
  }

  async function carregarDados() {
    try {
      const resp = await fetch('/api/admin', {
        headers: { 'Authorization': `Bearer ${senha}` }
      });
      
      if (resp.status === 401) { alert('Senha incorreta!'); return; }
      
      const json = await resp.json();
      dados = json.inscricoes;
      
      document.getElementById('totalACS').textContent = json.resumo.totalACS;
      document.getElementById('totalConvidados').textContent = json.resumo.totalConvidados;
      document.getElementById('totalTotal').textContent = json.resumo.totalParticipantes;
      
      const tabela = document.getElementById('tabela');
      tabela.innerHTML = '';
      dados.forEach((ins, i) => {
        const data = new Date(ins.dataInscricao).toLocaleString('pt-BR');
        tabela.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${ins.nomeACS}</td>
            <td>${ins.nomeConvidado || '—'}</td>
            <td>${data}</td>
          </tr>`;
      });
      
      document.getElementById('login').style.display = 'none';
      document.getElementById('conteudo').style.display = 'block';
    } catch (e) {
      alert('Erro ao carregar dados');
    }
  }

  function exportarCSV() {
    let csv = 'Nome ACS,Nome Convidado,Data Inscrição\n';
    dados.forEach(ins => {
      const data = new Date(ins.dataInscricao).toLocaleString('pt-BR');
      csv += `"${ins.nomeACS}","${ins.nomeConvidado || ''}","${data}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = 'inscricoes_festa_acs.csv'; a.click();
  }

  document.getElementById('senha').addEventListener('keypress', e => {
    if (e.key === 'Enter') entrar();
  });
</script>

</body>
</html>
